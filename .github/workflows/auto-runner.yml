name: Auto-run admin ops

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch: {}

jobs:
  call-auto-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Call auto_runner endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }} # lint-ignore: secrets context valid in GitHub Actions
          ADMIN_OPS_TOKEN: ${{ secrets.ADMIN_OPS_TOKEN }} # lint-ignore: secrets context valid in GitHub Actions
        run: |
          if [ -z "$APP_URL" ] || [ -z "$ADMIN_OPS_TOKEN" ]; then
            echo "::warning::APP_URL or ADMIN_OPS_TOKEN not set in repository secrets - skipping auto-runner call."
            exit 0
          fi
          echo "Calling $APP_URL/api/admin/auto_runner"
          code=$(curl -sS -o /tmp/auto_runner_body.json -w '%{http_code}' -X POST "$APP_URL/api/admin/auto_runner" \
            -H "x-admin-ops-token: $ADMIN_OPS_TOKEN" \
            -H 'Content-Type: application/json' || echo "000")
          cat /tmp/auto_runner_body.json 2>/dev/null || true
          echo
          echo "HTTP $code"
          case "$code" in
            2??) exit 0 ;;
            *) exit 1 ;;
          esac
